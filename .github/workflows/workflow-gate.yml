# BB_Maps CI-definition gate | v1.0.0 | 2026-10-25 | BB
#
# A PR that changes what CI RUNS — anything under .github/, any package
# manifest or lockfile (root or nested) whose scripts the runner invokes,
# lint/test/bundler configs, .npmrc (registry redirect), node/tool version
# pins, .husky/, scripts/, Makefile, Dockerfile, docker-compose.yml — must
# not merge on the strength of a check the PR itself rewrote: the gate
# cannot judge what supplies it, and a weakened "test": "exit 0" or an
# empty vitest include is the same bypass with a different file. Same rule
# as BMB's risky-path gate: red until a human adds `human-reviewed`. Agents
# never add that label — it is a NORM, not a technical control: the agent's
# gh token IS Sam's login, so actor checks can exclude bots and strangers
# but cannot tell Sam's own token from Sam. Same limitation as BMB's gate.
#
# Test files themselves are deliberately NOT gated here — ci.yml's own awk
# floor (# tests >= 62) makes deleting or hollowing a suite fail the
# required check directly, and gating every test edit on a human label
# would park ordinary work on Sam.
#
# WHY pull_request_target AND a file of its own: a `pull_request` workflow
# runs the PR's OWN copy — a gate inside ci.yml can be edited or deleted by
# the very diff it gates (bb-review P1 on PR #27; the estate hit this in
# 2026-09, memory `gate-cannot-judge-what-supplies-it`). pull_request_target
# runs the BASE branch's copy. The job never checks out PR code — it reads
# files, labels, timeline and run metadata through the API only.
#
# Freshness model: a label is valid for a head ONLY if it was applied
# after that head arrived on the PR. Arrival time is server-side: the
# earliest pull_request run created_at for the head sha — a normal
# push, a force-push and a branch reset all create a fresh synchronize run
# at arrival, and it cannot be backdated like committer.date (bb-review
# round 9 P1 / round 10 P2). A label older than that is stale and the
# step fails; a head-changing event also strips it (belt), but ONLY when
# proven stale — a label Sam adds in the seconds before the synchronize
# run starts is not destroyed.
#
# Other traps written against (estate memory + bb-review rounds):
#   * newline-in-path / rename evasion: jq startswith on whole JSON
#     strings; previous_filename checked too.
#   * edited over-strip: strips only when changes.base is present.
#   * pending-run replacement: a cancelled strip cannot open a hole —
#     freshness is proven every run, not just on labeled.
#   * moved-head overwrite: success exits only if the live head still
#     equals the event's head.sha.
#   * caps that fail closed: >=3000 changed files, label lists paginated.
#   * log injection: filenames print through jq @json, never raw.
#   * permissions: actions: read (the runs list), issues: write (the
#     strip), pull-requests: read, contents: read — nothing else.
#
# NOT required by itself: this only blocks merges once `Workflow-change
# gate` is a required check on main (post-merge step for Sam — a diff
# cannot set that). pull_request_target runs only files on the BASE
# branch, so this file cannot run until it is merged — its first
# demonstration is the NEXT PR that touches a gated file. If a head ever
# arrives with zero gate runs (automation-token push that triggers no
# workflows), pt is empty and the gate stays red by design — a human
# re-push or Sam resolves it.

name: Workflow-change gate

on:
  pull_request_target:
    # edited is here only for base retargets — the step ignores it unless
    # github.event.changes.base is present.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read
  issues: write # to strip `human-reviewed` when it is proven stale
  actions: read # to read this workflow's runs for the server-side push time

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false # an older run must not cancel the newer head's judgment

jobs:
  gate:
    name: Workflow-change gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      ACTION: ${{ github.event.action }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_CHANGED: ${{ github.event.changes.base && 'yes' || '' }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Gate CI-definition changes on human-reviewed
        shell: bash
        run: |
          # One fetch, slurped — the 3000-file API cap would otherwise pass
          # silently, and every jq read below works on the same JSON.
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" > pr-files.json
          total=$(jq -s 'map(length) | add' pr-files.json)
          if [ "${total:-0}" -ge 3000 ]; then
            echo "::error::PR reports $total changed files (>= 3000 API cap) — cannot prove no gate file is past the cap; failing closed"
            exit 1
          fi

          # The CI-definition set. Directory prefixes are root-anchored —
          # only the root .github/, scripts/ and .husky/ run in CI. File
          # names match on BASENAME, so a nested web/vitest.config.ts or
          # server/.npmrc cannot walk past (bb-review round 11 P1).
          # startswith/endswith run on whole JSON strings — a newline inside
          # a path cannot split itself invisible.
          hits=$(jq -sr 'def crit($f):
              ($f | startswith(".github/"))
              or ($f | startswith("scripts/"))
              or ($f | startswith(".husky/"))
              or (($f | split("/") | last) as $b |
                  ($b | startswith("eslint.config."))
                  or ($b | startswith(".eslintrc"))
                  or ($b | startswith("tsconfig"))
                  or ($b | startswith("vitest.config."))
                  or ($b | startswith("vitest.workspace."))
                  or ($b | startswith("vitest.setup."))
                  or ($b | startswith("vite.config."))
                  or ($b | startswith("jest.config."))
                  or ($b | startswith("playwright.config."))
                  or ($b | startswith("babel.config."))
                  or ($b | startswith("Dockerfile"))
                  or ($b | startswith("docker-compose."))
                  or ($b | startswith("compose."))
                  or ([ "package.json","package-lock.json","pnpm-lock.yaml","yarn.lock","bun.lockb","pnpm-workspace.yaml",".npmrc",".nvmrc",".node-version",".tool-versions",".eslintignore",".yarnrc",".yarnrc.yml","Makefile" ] | index($b)));
            .[] | .[] | select(crit(.filename) or (.previous_filename != null and crit(.previous_filename))) | .filename' pr-files.json)
          if [ -z "$hits" ]; then
            echo "no CI-definition changes — nothing to gate"
            exit 0
          fi
          # Filenames can carry control characters — never write them raw.
          echo "gate-critical files changed:"
          while IFS= read -r f; do jq -rn --arg f "$f" '$f | @json'; done <<< "$hits"

          # Timeline once: the LAST label-state event for human-reviewed
          # must be a `labeled` applied BY THE REPO OWNER (a personal
          # account — repository_owner IS Sam's login here), not a bot
          # identity and not followed by an unlabeled — a re-add by anyone
          # else, or a removal after the owner's label, reads empty
          # (bb-review round 11 P2).
          gh api --paginate "repos/$REPO/issues/$PR/timeline?per_page=100" > /tmp/tl.json
          lt=$(jq -sr --arg owner "$OWNER" '[.[][] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "human-reviewed")] | last
              | select(.event == "labeled" and .actor.login == $owner and (.actor.type // "User") != "Bot") | .created_at // empty' /tmp/tl.json)

          # Server-side arrival time of this head on the PR: the earliest
          # pull_request run created for the head sha. pull_request_target
          # runs carry the BASE sha in head_sha, which is why this queries
          # the pull_request event — ci.yml's run on that head was created
          # at push/reset time and is not backdatable (bb-review round 11
          # P1). Empty only when no pull_request run exists for the head —
          # fail closed (a head no workflow saw cannot be proven fresh).
          gh api --paginate "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" > /tmp/runs.json
          # -r matters: a quoted pt sorts before any digit, which would make
          # the freshness compare always-true (verified live).
          pt=$(jq -sr '[.[].workflow_runs[].created_at] | min // empty' /tmp/runs.json)

          # Stale approval, leg 1: on a head/base-changing event strip the
          # label — but ONLY a proven-stale one (lt absent or lt <= pt). A
          # fresh label added in the run's startup window is kept
          # (bb-review round 10 P3).
          head_changed=0
          if [ "$ACTION" = "synchronize" ] || [ "$ACTION" = "reopened" ] || { [ "$ACTION" = "edited" ] && [ -n "$BASE_CHANGED" ]; }; then
            head_changed=1
          fi
          # lt EMPTY is ambiguous — the timeline can lag a label write, so
          # never strip on an empty read; leg 2 still rejects anything that
          # does not prove fresh (bb-review round 11 P3).
          if [ "$head_changed" = 1 ] && [ -n "$lt" ] && { [ -z "$pt" ] || [ ! "$lt" \> "$pt" ]; }; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/human-reviewed" >/dev/null 2>&1 || true
            if [ -n "$(gh api --paginate "repos/$REPO/issues/$PR/labels?per_page=100" --jq '[.[].name] | index("human-reviewed") // empty')" ]; then
              echo "::error::$ACTION requires a fresh human-reviewed label, and a stale one could not be cleared — failing closed"
              exit 1
            fi
            echo "$ACTION: stale-or-absent human-reviewed cleared — a fresh review is required for this head"
          fi

          # Presence: exact match computed in jq — label names never enter
          # the script as text.
          if [ -z "$(gh api --paginate "repos/$REPO/issues/$PR/labels?per_page=100" --jq '[.[].name] | index("human-reviewed") // empty')" ]; then
            echo "::error::This PR changes CI-definition files — a human adds the 'human-reviewed' label after review. Agents never add it; every new head needs it again."
            exit 1
          fi

          # Stale approval, leg 2 — EVERY event: the owner-applied label
          # must postdate the head's server-side arrival time.
          if [ -z "$lt" ] || [ -z "$pt" ] || [ ! "$lt" \> "$pt" ]; then
            echo "::error::human-reviewed (owner-applied at '${lt:-never}') does not postdate this head's arrival ('${pt:-unknown}') — it must be added after the head it approves"
            exit 1
          fi

          # Moved-head overwrite: never let a run stamp green onto a head it
          # was not triggered for — the newer head's own run decides.
          live=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          if [ "$live" != "$HEAD_SHA" ]; then
            echo "::error::this run was triggered for $HEAD_SHA but the live head is $live — the newer head's run decides"
            exit 1
          fi

          echo "human-reviewed label present, owner-applied and fresh on the live head — gate satisfied"
