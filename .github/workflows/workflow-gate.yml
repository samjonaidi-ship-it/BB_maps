# BB_Maps workflow-change gate | v1.0.0 | 2026-10-25 | BB
#
# A PR that touches .github/workflows/ or .github/actions/ must not merge on
# the strength of a check the PR itself rewrote — the gate cannot judge what
# supplies it (estate gotcha; Devin SEC finding on PR #27). Same rule as
# BMB's risky-path gate: it stays red until a human adds the
# `human-reviewed` label. Agents never add that label — it is a NORM, not a
# technical control: the agent's gh token is Sam's login, so nothing in this
# job can tell them apart. Same limitation as BMB's gate.
#
# WHY pull_request_target AND a file of its own: a `pull_request` workflow
# runs the PR's OWN copy — a gate inside ci.yml can be edited or deleted by
# the very diff it gates (bb-review P1 on PR #27; the estate hit this in
# 2026-09, memory `gate-cannot-judge-what-supplies-it`). pull_request_target
# runs the BASE branch's copy, so no PR can rewrite this job. The job never
# checks out PR code — it only reads the changed-file list and labels
# through the API — so the privileged token stays safe: nothing executable
# comes from the PR side.
#
# Traps this version is written against (estate memory + bb-review rounds):
#   * run-time refs: pulls/$PR/files resolves at RUN time; judged against
#     the live PR it can only over-cover — and `synchronize`/`reopened`/
#     `edited` strip the label anyway, so a moved or retargeted head can
#     never ride an old approval.
#   * newline-in-path evasion: filtering happens in jq per JSON object
#     (startswith on the whole filename), never by grepping lines — a path
#     containing a newline cannot split itself invisible.
#   * rename evasion: previous_filename is checked too — renaming a
#     workflow OUT of .github/ still trips the gate.
#   * stale approval fails CLOSED: after a strip event, the labels are
#     re-fetched — if `human-reviewed` is still there (403, rate limit,
#     5xx on the DELETE), the step fails instead of passing on it.
#   * 3000-file API cap: if the PR reports >= 3000 changed files the gate
#     fails closed rather than passing silently.
#   * concurrency keyed on head.sha, not PR number, so a run can never
#     cancel the newer head's judgment.
#
# NOT required by itself: this check only blocks merges once
# `Workflow-change gate` is added to branch-protection required checks on
# main (post-merge step for Sam — a diff cannot set that). And
# pull_request_target only runs files that exist on the BASE branch, so
# this file cannot run until it is merged — its first demonstration is the
# NEXT PR that touches .github/.

name: Workflow-change gate

on:
  pull_request_target:
    # edited too: retargeting the PR to a different base re-opens the
    # question of what the reviewed head was.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read
  issues: write # to strip `human-reviewed` on head-changing events

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false # an older run must not cancel the newer head's judgment

jobs:
  gate:
    name: Workflow-change gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      ACTION: ${{ github.event.action }}
    steps:
      - name: Gate workflow/action changes on human-reviewed
        shell: bash
        run: |
          # One fetch, slurped — the 3000-file API cap would otherwise pass
          # silently, and every jq read below works on the same JSON.
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" > pr-files.json
          total=$(jq -s 'map(length) | add' pr-files.json)
          if [ "${total:-0}" -ge 3000 ]; then
            echo "::error::PR reports $total changed files (>= 3000 API cap) — cannot prove no workflow file is past the cap; failing closed"
            exit 1
          fi

          # Filter in jq per JSON object — a filename containing a newline
          # cannot evade startswith the way a grepped line can.
          hits=$(jq -sr '.[] | .[] | select((.filename|startswith(".github/workflows/") or startswith(".github/actions/")) or (.previous_filename != null and (.previous_filename|startswith(".github/workflows/") or startswith(".github/actions/")))) | .filename' pr-files.json)
          if [ -z "$hits" ]; then
            echo "no .github/workflows|actions changes — nothing to gate"
            exit 0
          fi
          echo "gate-critical files changed:"
          echo "$hits"

          # Stale approval: on any event that can mean the head or base
          # changed, the label must be re-earned. Strip it, then RE-FETCH —
          # a label that survived the DELETE (403/5xx/rate-limit) fails the
          # step instead of passing (bb-review P1, round 7).
          case "$ACTION" in
            synchronize|reopened|edited)
              gh api -X DELETE "repos/$REPO/issues/$PR/labels/human-reviewed" >/dev/null 2>&1
              if [ -n "$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | index("human-reviewed") // empty')" ]; then
                echo "::error::$ACTION requires a fresh human-reviewed label, and the old one could not be cleared — failing closed"
                exit 1
              fi
              echo "$ACTION: human-reviewed stripped (or was absent) — a fresh review is required for this head"
              ;;
          esac

          # Exact match computed in jq — label names never enter the script
          # as text (no injection path, no partial-name match).
          if [ -z "$(gh api "repos/$REPO/issues/$PR/labels" --jq '[.[].name] | index("human-reviewed") // empty')" ]; then
            echo "::error::This PR changes .github/(workflows|actions)/ — a human adds the 'human-reviewed' label after review. Agents never add it; every new head needs it again."
            exit 1
          fi
          echo "human-reviewed label present — gate satisfied"
