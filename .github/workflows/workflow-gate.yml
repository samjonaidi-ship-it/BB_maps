# BB_Maps CI-definition gate | v1.0.0 | 2026-10-25 | BB
#
# A PR that changes what CI RUNS — anything under .github/, any package
# manifest or lockfile (any depth — matched on basename), lint/test/bundler
# configs, .npmrc (registry redirect), node/tool version pins, .husky/,
# scripts/, Makefile/GNUmakefile/*.mk, Dockerfile*/docker-compose*/compose.*
# — must not merge on the strength of a check the PR itself rewrote: the
# gate cannot judge what supplies it, and a weakened "test": "exit 0", an
# empty vitest include, or a .pnpmfile.cjs is the same bypass with a
# different file. Same rule as BMB's risky-path gate: red until a human
# approves AND the `human-reviewed` label is present. Agents never do
# either — it is a NORM, not a technical control: the agent's gh token IS
# Sam's login, so actor checks can exclude bots and strangers but cannot
# tell Sam's own token from Sam. Same limitation as BMB's gate.
#
# THE BINDING (bb-review rounds 8-12): labels and timestamps cannot prove
# WHICH head a human approved — a label click races the next push, and a
# sha that arrives twice keeps its first arrival time, so a label applied
# to a benign head could bless a gated sha it returned to. A REVIEW is the
# only signal GitHub binds to a commit: this gate requires an APPROVED
# review by the repo owner whose commit_id equals the event's head sha —
# approval on sha A can never count for sha B. Approval must also postdate
# the last base_ref_changed timeline event, so retargeting the PR
# invalidates it. The `human-reviewed` label stays required too — estate
# convention, and the signal Sam already knows — but it is cosmetic beside
# the sha-bound approval.
#
# Test files themselves are deliberately NOT gated here — ci.yml's own awk
# floor (# tests >= 62) makes deleting or hollowing the suite fail the
# required check directly, and gating every test edit on a human label
# would park ordinary work on Sam.
#
# WHY pull_request_target AND a file of its own: a `pull_request` workflow
# runs the PR's OWN copy — a gate inside ci.yml can be edited or deleted by
# the very diff it gates (bb-review P1 on PR #27; the estate hit this in
# 2026-09, memory `gate-cannot-judge-what-supplies-it`). pull_request_target
# runs the BASE branch's copy. The job never checks out PR code — the diff
# is read via the compare API pinned to the EVENT's head sha, not the live
# head (a live-head read can stamp green onto a head it never saw).
#
# Other traps written against:
#   * newline-in-path / rename evasion: jq matching on whole JSON strings;
#     previous_filename checked too.
#   * moved-head overwrite: the live head is re-fetched before EVERY exit,
#     success or early-green — a run can never stamp its verdict onto a
#     head it was not triggered for.
#   * compare files array caps at 300 — >=300 fails closed.
#   * log injection: filenames print through jq @json, never raw.
#   * concurrency keyed on head.sha, so a run can never cancel the newer
#     head's judgment.
#
# NOT required by itself: this only blocks merges once `Workflow-change
# gate` is a required check on main (post-merge step for Sam — a diff
# cannot set that). pull_request_target runs only files on the BASE
# branch, so this file cannot run until it is merged — its first
# demonstration is the NEXT PR that touches a gated file.
#
# KNOWN RESIDUAL: GitHub does not fire an event when commits are pushed to
# a CLOSED pull request's branch. If a closed PR's branch gains a new head
# and the PR is reopened, the reopened run sees the new head and demands a
# fresh approval — closed by the sha binding, but stated for completeness.

name: Workflow-change gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, review_requested, ready_for_review]

permissions:
  contents: read
  pull-requests: read # reviews + compare
  issues: read # labels

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false # an older run must not cancel the newer head's judgment

jobs:
  gate:
    name: Workflow-change gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      OWNER: ${{ github.repository_owner }} # personal-account repo: this IS Sam's login
    steps:
      - name: Gate CI-definition changes on human-reviewed
        shell: bash
        run: |
          # Moved-head check BEFORE anything that can exit 0 — a run reads
          # the API at run time and must never stamp a verdict onto a head
          # it was not triggered for.
          live=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          if [ "$live" != "$HEAD_SHA" ]; then
            echo "::error::this run was triggered for $HEAD_SHA but the live head is $live — the newer head's own run decides"
            exit 1
          fi

          # The diff pinned to the EVENT's head sha, via compare — never the
          # live head's file list (bb-review round 12 P2).
          gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" > /tmp/cmp.json
          total=$(jq '.files | length' /tmp/cmp.json)
          if [ "${total:-0}" -ge 300 ]; then
            echo "::error::PR reports $total changed files (>= 300 compare cap) — cannot prove no gate file is past the cap; failing closed"
            exit 1
          fi

          # The CI-definition set. Directory prefixes are root-anchored —
          # only the root .github/, scripts/ and .husky/ run in CI — but
          # scripts also match at ANY depth (a nested package.json test
          # script can call web/scripts/x.mjs). File names match on
          # BASENAME so web/vitest.config.ts or server/.npmrc cannot walk
          # past. startswith/endswith run on whole JSON strings — a newline
          # inside a path cannot split itself invisible.
          hits=$(jq -r 'def crit($f):
              ($f | startswith(".github/"))
              or ($f | startswith(".husky/"))
              or ($f | test("(^|/)scripts/"))
              or (($f | split("/") | last) as $b |
                  ($b | startswith("eslint.config."))
                  or ($b | startswith(".eslintrc"))
                  or ($b | startswith("tsconfig"))
                  or ($b | startswith("vitest.config."))
                  or ($b | startswith("vitest.workspace."))
                  or ($b | startswith("vitest.setup."))
                  or ($b | startswith("vite.config."))
                  or ($b | startswith("jest.config."))
                  or ($b | startswith("playwright.config."))
                  or ($b | startswith("babel.config."))
                  or ($b | startswith("webpack.config."))
                  or ($b | startswith("rollup.config."))
                  or ($b | startswith("next.config."))
                  or ($b | startswith("postcss.config."))
                  or ($b | test("Dockerfile"))
                  or ($b | startswith("docker-compose."))
                  or ($b | startswith("compose."))
                  or ($b | endswith(".mk"))
                  or ([ "package.json","package-lock.json","npm-shrinkwrap.json","pnpm-lock.yaml","yarn.lock","bun.lock","bun.lockb","pnpm-workspace.yaml",".npmrc",".pnpmfile.cjs",".nvmrc",".node-version",".tool-versions",".eslintignore",".yarnrc",".yarnrc.yml","Makefile","GNUmakefile" ] | index($b)));
            .files[] | select(crit(.filename) or (.previous_filename != null and crit(.previous_filename))) | .filename' /tmp/cmp.json)
          if [ -z "$hits" ]; then
            echo "no CI-definition changes — nothing to gate"
            exit 0
          fi
          # Filenames can carry control characters — never write them raw.
          echo "gate-critical files changed:"
          while IFS= read -r f; do jq -rn --arg f "$f" '$f | @json'; done <<< "$hits"

          # 1/3 — estate convention: the human-reviewed label must be on the
          # PR. Cosmetic beside the sha-bound approval, but it is the signal
          # every managed repo already uses.
          if [ -z "$(gh api --paginate "repos/$REPO/issues/$PR/labels?per_page=100" --jq '[.[].name] | index("human-reviewed") // empty')" ]; then
            echo "::error::This PR changes CI-definition files — a human adds the 'human-reviewed' label AND approves the current head. Agents do neither; every new head needs both again."
            exit 1
          fi

          # 2/3 — THE BINDING: an APPROVED review by the repo owner whose
          # commit_id IS this head sha, submitted after the last
          # base_ref_changed (a retarget invalidates approvals of the same
          # sha — the diff changed under it).
          gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100" > /tmp/reviews.json
          gh api --paginate "repos/$REPO/issues/$PR/timeline?per_page=100" > /tmp/tl.json
          last_retarget=$(jq -sr '[.[][] | select(.event == "base_ref_changed") | .created_at] | last // "1970-01-01T00:00:00Z"' /tmp/tl.json)
          approved=$(jq -sr --arg owner "$OWNER" --arg sha "$HEAD_SHA" --arg rt "$last_retarget" '
            [.[][] | select(.state == "APPROVED" and .commit_id == $sha and .user.login == $owner and (.user.type // "User") != "Bot" and .submitted_at > $rt)] | last | .submitted_at // empty' /tmp/reviews.json)
          if [ -z "$approved" ]; then
            echo "::error::no owner APPROVED review bound to head $HEAD_SHA (submitted after any base retarget at $last_retarget) — Sam approves THIS head, then labels human-reviewed"
            exit 1
          fi

          # 3/3 — moved-head overwrite, again: between the diff read and now
          # the head may have moved; the newest head's run decides.
          live=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          if [ "$live" != "$HEAD_SHA" ]; then
            echo "::error::head moved to $live during this run — the newer head's run decides"
            exit 1
          fi

          echo "label present + owner approval bound to the live head at $approved — gate satisfied"
