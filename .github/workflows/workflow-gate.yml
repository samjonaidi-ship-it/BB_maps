# BB_Maps CI-definition gate | v1.0.0 | 2026-10-25 | BB
#
# A PR that changes what CI RUNS — anything under .github/, the package
# manifests and lockfiles whose scripts the runner invokes, lint/test/
# runner configs, .npmrc (registry redirect), node version pins, scripts/ —
# must not merge on the strength of a check the PR itself rewrote: the gate
# cannot judge what supplies it, and a weakened "test": "exit 0" or an
# empty vitest include is the same bypass with a different file
# (bb-review P2s, rounds 8-9). Same rule as BMB's risky-path gate: it stays
# red until a human adds the `human-reviewed` label. Agents never add that
# label — it is a NORM, not a technical control: the agent's gh token is
# Sam's login, so nothing in this job can tell them apart. Same limitation
# as BMB's gate.
#
# WHY pull_request_target AND a file of its own: a `pull_request` workflow
# runs the PR's OWN copy — a gate inside ci.yml can be edited or deleted by
# the very diff it gates (bb-review P1 on PR #27; the estate hit this in
# 2026-09, memory `gate-cannot-judge-what-supplies-it`). pull_request_target
# runs the BASE branch's copy, so no PR can rewrite this job. The job never
# checks out PR code — it only reads the changed-file list, labels and
# timeline through the API — so the privileged token stays safe: nothing
# executable comes from the PR side.
#
# Traps this version is written against (estate memory + bb-review rounds):
#   * newline-in-path evasion: filtering happens in jq per JSON object,
#     never by grepping lines — a path containing a newline cannot split
#     itself invisible.
#   * rename evasion: previous_filename is checked too.
#   * stale approval fails CLOSED on TWO legs: head-changing events strip
#     the label AND every run that finds it present also proves its
#     created_at postdates the push that produced this head — measured
#     server-side by the earliest check-suite created_at on the head sha,
#     never by committer.date, which is client-set.
#   * edited over-strip: `edited` strips only when the event carries
#     changes.base (a real retarget); body edits are routine per AGENTS §7.
#   * pending-run replacement: GitHub may cancel a PENDING same-group run —
#     that can skip a strip, but it cannot skip the timeline freshness
#     check, which runs on every event that reaches the label check.
#   * moved-head overwrite: before going green the job re-fetches the live
#     head sha and fails if it is not the head this run was triggered for.
#   * 3000-file API cap and 30-label default page: both bounded, both fail
#     closed past the cap (--paginate everywhere else).
#   * log injection: filenames print through jq @json, never raw.
#   * concurrency keyed on head.sha, so a run can never cancel the newer
#     head's judgment.
#
# NOT required by itself: this check only blocks merges once
# `Workflow-change gate` is added to branch-protection required checks on
# main (post-merge step for Sam — a diff cannot set that). And
# pull_request_target only runs files that exist on the BASE branch, so
# this file cannot run until it is merged — its first demonstration is the
# NEXT PR that touches .github/.

name: Workflow-change gate

on:
  pull_request_target:
    # edited is here only for base retargets — the step ignores it unless
    # github.event.changes.base is present.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read
  issues: write # to strip `human-reviewed` on head-changing events

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false # an older run must not cancel the newer head's judgment

jobs:
  gate:
    name: Workflow-change gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      ACTION: ${{ github.event.action }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_CHANGED: ${{ github.event.changes.base && 'yes' || '' }}
    steps:
      - name: Gate CI-definition changes on human-reviewed
        shell: bash
        run: |
          # One fetch, slurped — the 3000-file API cap would otherwise pass
          # silently, and every jq read below works on the same JSON.
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" > pr-files.json
          total=$(jq -s 'map(length) | add' pr-files.json)
          if [ "${total:-0}" -ge 3000 ]; then
            echo "::error::PR reports $total changed files (>= 3000 API cap) — cannot prove no gate file is past the cap; failing closed"
            exit 1
          fi

          # The CI-definition set: files whose change alters what a required
          # check actually executes. startswith() on the whole JSON string.
          hits=$(jq -sr 'def crit($f):
              ($f | startswith(".github/"))
              or ($f | startswith("scripts/"))
              or ($f | startswith("eslint.config."))
              or ($f | startswith(".eslintrc"))
              or ($f | startswith("tsconfig"))
              or ($f | startswith("vitest.config."))
              or ($f | startswith("jest.config."))
              or ($f | startswith("playwright.config."))
              or (["package.json","package-lock.json","pnpm-lock.yaml","yarn.lock",".npmrc",".nvmrc",".node-version",".eslintignore","Makefile","docker-compose.yml","Dockerfile"] | index($f));
            .[] | .[] | select(crit(.filename) or (.previous_filename != null and crit(.previous_filename))) | .filename' pr-files.json)
          if [ -z "$hits" ]; then
            echo "no CI-definition changes — nothing to gate"
            exit 0
          fi
          # Filenames can carry control characters — never write them raw.
          echo "gate-critical files changed:"
          while IFS= read -r f; do jq -rn --arg f "$f" '$f | @json'; done <<< "$hits"

          # Stale approval, leg 1: head/base-changing events strip the
          # label. edited counts ONLY on a base retarget (changes.base).
          if [ "$ACTION" = "synchronize" ] || [ "$ACTION" = "reopened" ] || { [ "$ACTION" = "edited" ] && [ -n "$BASE_CHANGED" ]; }; then
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/human-reviewed" >/dev/null 2>&1 || true
            # Re-fetch — a surviving label (403/5xx/rate-limit) fails closed.
            if [ -n "$(gh api --paginate "repos/$REPO/issues/$PR/labels?per_page=100" --jq '[.[].name] | index("human-reviewed") // empty')" ]; then
              echo "::error::$ACTION requires a fresh human-reviewed label, and the old one could not be cleared — failing closed"
              exit 1
            fi
            echo "$ACTION: human-reviewed stripped (or was absent) — a fresh review is required for this head"
          fi

          # Exact match computed in jq — label names never enter the script
          # as text (no injection path, no partial-name match).
          if [ -z "$(gh api --paginate "repos/$REPO/issues/$PR/labels?per_page=100" --jq '[.[].name] | index("human-reviewed") // empty')" ]; then
            echo "::error::This PR changes CI-definition files — a human adds the 'human-reviewed' label after review. Agents never add it; every new head needs it again."
            exit 1
          fi

          # Stale approval, leg 2 — on EVERY event, not only `labeled`: the
          # label must postdate the push that produced this head. Push time
          # is measured server-side: the earliest check-suite created_at on
          # the head sha (ci.yml's pull_request run creates one at push
          # time). committer.date is client-set and never trusted. A label
          # added for an older head, or one that survived a cancelled strip
          # (pending-run replacement), reads STALE here and fails.
          gh api --paginate "repos/$REPO/issues/$PR/timeline?per_page=100" > /tmp/tl.json
          lt=$(jq -sr '[.[][] | select(.event == "labeled" and .label.name == "human-reviewed") | .created_at] | last // empty' /tmp/tl.json)
          pt=$(gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-suites?per_page=100" --jq '[.check_suites[].created_at] | min // empty')
          if [ -z "$lt" ] || [ -z "$pt" ] || [ ! "$lt" \> "$pt" ]; then
            echo "::error::human-reviewed (labeled at '${lt:-never}') does not postdate this head's push time ('${pt:-unknown}') — it must be added after the head it approves"
            exit 1
          fi

          # Moved-head overwrite: never let a run stamp green onto a head it
          # was not triggered for — the newer head's own run decides.
          live=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          if [ "$live" != "$HEAD_SHA" ]; then
            echo "::error::this run was triggered for $HEAD_SHA but the live head is $live — the newer head's run decides"
            exit 1
          fi

          echo "human-reviewed label present and fresh on the live head — gate satisfied"
