# BB_Maps CI | v1.0.0 | 2026-10-25 | BB
#
# First CI for this repo — branch protection exists but had no check to
# require, so every push to main deployed unreviewed. This workflow gives
# protection a required context: the job name `CI`.
#
# Scope is deliberately what the repo can honestly run (each command verified
# locally, exit 0 — on node 26; the job itself pins node 20, the Dockerfile
# runtime):
#   npm ci                            — installs clean from package-lock.json
#   npm run lint                      — eslint src --max-warnings 0
#   npm test                          — node --test (62 tests, ~45 s, no network:
#                                       routes are exercised through
#                                       fastify.inject with stub upstreams)
#   npm audit --audit-level=critical  — same severity threshold as BMB, but
#                                       ADVISORY here (continue-on-error) so
#                                       a new advisory or registry outage
#                                       cannot block unrelated merges
#
# No devin-gate / risky-path job: those live in repos that carry
# scripts/check-risky-paths.mjs and the devin-gate workflow, which this repo
# does not (yet). Adding them is a follow-up, not part of first CI.
#
# No `paths:` filter under `on:` — a required check that can be skipped by
# path filtering reports nothing and blocks the merge (BMB ci.yml v2.6.1
# header documents the same rule).
#
# This PR also fixes the test script: `node --test src/**/*.test.js` was
# silently broken on this repo's runtime. Glob args to --test need node 21+,
# and on a POSIX shell `**` expands to ONE level — so on node 20 (the
# Dockerfile runtime) `npm test` ran src/routes/*.test.js only and skipped
# src/refresh-scheduler.test.js. Bare `node --test` scans cwd recursively,
# skips node_modules and dot-directories (verified: a probe .test.js under
# .claude/ was NOT picked up), and refresh-scheduler.test.js needs repo-root
# cwd anyway (it resolve()s Dockerfile and refresh-maps.sh).

name: CI

# No secrets and no write needs: pin the token to read-only so a compromised
# dependency running under `npm ci` / `npm test` on a push to main gets a
# token that can do nothing but read (bb-review P2, 2026-10-25).
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Per-ref group: a newer push to a PR cancels the older run; push-to-main
  # runs get their own group keyed by sha so every main commit gets a verdict
  # (same fix as BMB ci.yml v2.6.0 — Actions keeps only ONE pending run per
  # group, so a shared main group would silently drop a verdict).
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  ci:
    name: CI
    needs: [gitleaks]
    if: ${{ !cancelled() }}  # a skipped job reads as success to branch protection - the first step fails closed instead
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC # matches the Railway/production runtime convention (BMB suite)
    steps:
      - name: Fail unless the gitleaks scan succeeded
        if: needs.gitleaks.result != 'success'
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          echo "::error::gitleaks result is $GITLEAKS_RESULT - a skipped or failed scan is never a pass"
          exit 1
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # was @v5

      - name: Setup Node 20 (the Dockerfile runtime)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # was @v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # `npm test` runs bare `node --test`, which exits 0 when it discovers
      # ZERO test files — a silent green check. Force the TAP reporter so the
      # summary counters (`# tests`/`# pass`/`# fail`) are version-stable,
      # then assert on the summary itself: at least the 62 tests that exist
      # today, all passing, none failing, AND the refresh-scheduler.test.js
      # tests (named `refresh-maps.sh: …`) — that top-level file is the one
      # silent discovery misses (bb-review P2, 2026-10-25).
      # `shell: bash` is explicit so the tee'd pipeline runs under
      # -eo pipefail: without it a failed npm test could return tee's 0
      # (bb-review P1). The TAP assertions below do not depend on the pipe
      # status either way — a failing run prints # fail >= 1.
      - name: Test
        shell: bash
        run: |
          npm test -- --test-reporter=tap 2>&1 | tee test-output.txt
          # The 62 floor is a ratchet: lower it in the same PR that removes
          # or consolidates tests, or CI goes red for no visible reason.
          # No describe()/suite()/subtest exists in this suite (checked
          # 2026-10-25), so node 20 counts # tests the same way node 26 does —
          # the 62 measured locally transfers. If a future node 20 counts
          # differently, THIS PR's own run is the check and fails closed.
          # cancelled==0 and skipped==0 too: AGENTS.md §3 — a cancelled or
          # skipped test proved nothing, so they fail the gate outright
          # (bb-review P2, round 5).
          awk '/^# tests /{t=$3+0} /^# pass /{p=$3+0} /^# fail /{f=$3+0} /^# cancelled /{c=$3+0} /^# skipped /{s=$3+0} END{exit !(t>=62 && p>=62 && f==0 && c==0 && s==0)}' test-output.txt
          # Anchored to a TAP result line, not a bare substring — a stack
          # trace or an error message mentioning the script must not satisfy
          # it (bb-review P2, round 4). Skipped refresh-maps.sh tests are
          # already impossible here because the awk above fails on any
          # # skipped > 0.
          grep -Eq '^ok [0-9]+ - refresh-maps\.sh:' test-output.txt

      # Advisory, never blocking: npm audit answers from a live advisory feed,
      # so a NEW critical advisory on a transitive dep — or a registry 5xx —
      # would turn the required check red on every unrelated PR, including the
      # one that fixes the dep (bb-review P2, round 3). Findings still show in
      # the run log; BMB keeps the same gate required there because its
      # dependency surface is managed more tightly. Promote to blocking in a
      # follow-up if Sam wants it.
      - name: Audit (critical only, advisory)
        continue-on-error: true
        run: npm audit --audit-level=critical

  gitleaks:
    permissions: { contents: read }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks - new secrets in this run's commits only
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          for i in 1 2 3; do
            rm -f /tmp/gitleaks.tgz
            curl -fsSL --max-time 60 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz && break
            echo "gitleaks download attempt $i failed - retrying"; sleep 5
          done
          [ -s /tmp/gitleaks.tgz ] || { echo "::error::gitleaks tarball download failed after 3 attempts (release outage or network)"; exit 1; }
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          # Judge ONLY the commits this run introduces: the PR range on
          # pull_request (the merge commit carries the base tip in its own
          # history, so no extra fetch is needed), the pushed range on push.
          # A full-history --all scan would go red on unrelated branches' refs
          # and on pre-existing findings that are not this PR's to fix.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${BASE_SHA}..HEAD"
          elif [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            RANGE="${BEFORE_SHA}..HEAD"
          else
            # dispatch/schedule/other: scan what this branch adds over main.
            # A shallow HEAD~N fallback would let a manual run flip a red scan green.
            MB=$(git merge-base origin/main HEAD 2>/dev/null) || { echo "::error::no merge-base with origin/main - scan range undetermined"; exit 1; }
            RANGE="$MB..HEAD"
          fi
          echo "gitleaks range: $RANGE"
          # A zero-commit range would scan nothing and exit 0: never a pass on a PR or push.
          N=$(git rev-list --count "$RANGE") || { echo "::error::cannot count commits in $RANGE"; exit 1; }
          echo "gitleaks commits in range: $N"
          if [ "$N" = "0" ]; then
            if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then echo "::error::zero commits to scan on a $EVENT_NAME - range undetermined"; exit 1; fi
            echo "::notice::nothing new to scan on $EVENT_NAME"
          fi
          # Rules come from this file, never from the checked-out tree: a PR that adds a
          # .gitleaks.toml allowlist (config allowlists are NOT disabled by --ignore-gitleaks-allow)
          # must not be able to hide its own secret.
          printf '[extend]\nuseDefault = true\n' > /tmp/gitleaks-trusted.toml
          # .gitleaksignore in the PR tree would also hide a finding (its fingerprint is printed on the first red run): use an empty one.
          : > /tmp/gitleaks-empty-ignore
          /tmp/gitleaks git . --config /tmp/gitleaks-trusted.toml --gitleaks-ignore-path /tmp/gitleaks-empty-ignore --log-opts="--text $RANGE" --redact --exit-code 1 --ignore-gitleaks-allow
