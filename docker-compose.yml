version: '3.8'

services:
  # --- BB_Maps API server ---
  bb-maps:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - PHOTON_URL=http://photon:2322
      - TILES_DIR=/data/tiles
      - STYLES_DIR=/data/styles
      - FONTS_DIR=/data/fonts
      - SPRITES_DIR=/data/sprites
      - ASSETS_DIR=/data/assets
      - DATA_DIR=/data
      - VERSION_FILE=/data/version.json
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    # ONE volume at /data, like Railway: refresh-maps.sh swaps fonts/ and sprites/
    # by rename, and a mount point under /data cannot be renamed (Devin, PR #11).
    volumes:
      - maps-data:/data
    depends_on:
      photon:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- Photon Geocoder (OSM-based, Bay Area extract) ---
  # Uses Mapstack's pre-built Photon image with auto-download
  photon:
    image: rtuszik/photon-docker:2.3 # pinned; mapstack-photon needs a valkey companion (Railway incident 2026-07-02). Prod currently uses PHOTON_URL=https://photon.komoot.io (interim — self-host needs a ~25GB volume for the REGION=us prebuilt index)
    environment:
      # Download Bay Area extract on first boot (~500MB)
      - REGION=us
      - PHOTON_DOWNLOAD_URL=${PHOTON_DOWNLOAD_URL:-}
    volumes:
      - photon-data:/photon/data
    ports:
      - "2322:2322"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2322/api?q=test&limit=1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  maps-data:
    driver: local
  photon-data:
    driver: local
